<script>(function(){'use strict';var notes=['人不在你身边，惦记却总会先跑到你那里。','听见你的名字，还是会忍不住多留意一下。','想和你把以后的日子，过成彼此都觉得踏实的样子。'];var count=0,timer=null,button=document.getElementById('press'),stamp=document.getElementById('stamp');function clearMotion(){if(timer!==null){clearTimeout(timer);timer=null;}stamp.classList.remove('pressing');}button.addEventListener('click',function(){if(count>=3)return;clearMotion();void stamp.offsetWidth;stamp.classList.add('pressing');document.getElementById('line'+count).textContent=notes[count];document.getElementById('seal'+count).hidden=false;count++;button.textContent=count===1?'再盖一枚偏心章':count===2?'盖下最后一枚珍惜章':'三份心意，全部确认 ♡';button.disabled=count===3;document.getElementById('hint').textContent=count===3?'这张心意单，只写给你。':'已盖好 '+count+' / 3 枚心意章';document.getElementById('signature').textContent=count===3?'—— 想你的我 · 2026.11.28':'还有心里话，想继续说给你听。';timer=setTimeout(function(){stamp.classList.remove('pressing');timer=null;},380);});document.getElementById('reset').addEventListener('click',function(){clearMotion();count=0;for(var i=0;i<3;i++){document.getElementById('line'+i).textContent='';document.getElementById('seal'+i).hidden=true;}button.disabled=false;button.textContent='盖下第一枚心意章';document.getElementById('hint').textContent='轻轻盖一下，第一句话就出现。';document.getElementById('signature').textContent='今天的心意，还等着盖章。';});var music=document.getElementById('music'),status=document.getElementById('music-status');music.addEventListener('playing',function(){status.textContent='轻音乐播放中 · 可以随时暂停';});music.addEventListener('pause',function(){status.textContent='音乐已暂停 · 想听时再点 ▶';});music.addEventListener('error',function(){status.textContent='音乐暂时加载失败，可以稍后重试；心意单仍可正常查看。';});document.addEventListener('visibilitychange',function(){if(document.hidden)music.pause();});window.addEventListener('pagehide',function(){music.pause();});})();</script></body></html>
