<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#eaf0f8"><title>晓晓，打开今天的心意八音盒</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:linear-gradient(145deg,#e7eef8,#f7e8ef);color:#59637c;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding:calc(18px + env(safe-area-inset-top)) 18px calc(28px + env(safe-area-inset-bottom))}main{max-width:460px;margin:auto}.back{display:inline-block;color:#8b90a7;font-size:14px;padding:12px 0 18px;text-decoration:none}.card{background:#ffffffc9;border:1px solid white;border-radius:30px;box-shadow:0 20px 50px #8995ab18;text-align:center;overflow:hidden}.head{padding:28px 20px 0}.eyebrow{font-size:11px;letter-spacing:4px;color:#9b9bb1;margin:0 0 12px}h1{font:500 28px/1.6 Georgia,"Songti SC",serif;margin:0 0 12px}.intro{color:#9395a6;font-size:14px;line-height:1.9;margin:0}.stage{height:220px;position:relative;perspective:700px}.box{position:absolute;width:188px;height:92px;left:calc(50% - 94px);bottom:26px;background:linear-gradient(135deg,#b4bbd4,#929ebd);border:2px solid #8e9ab9;border-radius:12px 12px 25px 25px;box-shadow:0 16px 22px #8190aa25}.box:after{content:"♡";position:absolute;left:0;right:0;top:24px;color:#fdf1ed;font-size:34px}.lid{position:absolute;left:-2px;right:-2px;top:-22px;height:35px;border:2px solid #8e9ab9;background:linear-gradient(130deg,#d7dced,#b5bfd8);border-radius:14px;transform-origin:50% 85%;transition:transform 1s}.lid:after{content:"✦";position:absolute;inset:0;color:#fbf4e5;font-size:22px}.stage.open .lid{transform:translateY(-62px) rotateX(-35deg)}.note{position:absolute;left:calc(50% - 12px);bottom:91px;font-size:27px;color:#b899b8;opacity:0;pointer-events:none}.open .note{animation:rise 3.6s ease-in-out infinite}.note.two{left:calc(50% - 55px);animation-delay:.8s!important;font-size:21px}.note.three{left:calc(50% + 34px);animation-delay:1.6s!important;color:#a3accb}.body{padding:0 22px 26px}.letter{min-height:123px;border:1px solid #e0dfe9;background:#fffdf7;border-radius:20px;padding:18px 10px;display:grid;place-items:center}.letter p{font:18px/1.95 Georgia,"Songti SC",serif;margin:0;white-space:pre-line}.turn{font-size:11px;letter-spacing:2px;color:#a29bb0;margin:14px 0}.mainbutton{width:100%;min-height:49px;border:0;border-radius:25px;background:#8a95b5;color:#fffdf8;padding:13px;font:500 15px/1.5 -apple-system,"PingFang SC",sans-serif;cursor:pointer;touch-action:manipulation}.music{border:1px solid #dfdeeb;background:#f8f7fb;border-radius:19px;padding:15px 12px;margin-top:21px}.music h2{font-size:13px;font-weight:500;margin:0 0 12px;color:#84889e}audio{display:block;width:100%;height:42px}.status{font-size:11px;line-height:1.8;color:#9d96ab;margin:11px 0 0;min-height:20px}.reset{font:12px/1.7 -apple-system,"PingFang SC",sans-serif;margin-top:16px;border:0;border-bottom:1px solid #c7c4d7;border-radius:0;background:none;color:#9691a6;min-height:42px;cursor:pointer}button:focus-visible,a:focus-visible,audio:focus-visible{outline:3px solid #b18c9b;outline-offset:4px}.foot{text-align:center;color:#a7a2ae;font-size:11px;line-height:1.8;margin-top:20px}@keyframes rise{0%{opacity:0;transform:translateY(0) rotate(-10deg)}30%{opacity:.8}100%{opacity:0;transform:translate(15px,-100px) rotate(12deg)}}@media(max-width:350px){h1{font-size:24px}.body{padding:0 15px 24px}.letter p{font-size:17px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.open .note{opacity:.5;transform:translateY(-65px)}}
</style></head><body><main><a class="back" href="../../../">← 返回心意合集</a><section class="card"><header class="head"><p class="eyebrow">一 点 旋 律 · 几 句 心 里 话</p><h1>晓晓，打开今天的心意八音盒</h1><p class="intro">把喜欢藏进一段轻柔旋律，<br>等你有空，慢慢打开。</p></header><div class="stage" id="stage" aria-hidden="true"><span class="note">♪</span><span class="note two">♡</span><span class="note three">♫</span><div class="box"><div class="lid"></div></div></div><div class="body"><div class="letter" role="status" aria-live="polite"><p id="words">盒子里装的不是什么大惊喜，<br>是今天又想起你的几个瞬间。</p></div><p class="turn" id="turn">心意八音盒 · 还没有打开</p><button type="button" class="mainbutton" id="open">打开八音盒，听听音乐 ♡</button><section class="music" aria-label="背景音乐播放区"><h2>♫ 轻柔纯音乐</h2><audio id="music" controls loop playsinline preload="metadata"><source src="../../../assets/soft-evening.mp3" type="audio/mpeg">此浏览器不支持音频播放。</audio><p class="status" id="status" role="status" aria-live="polite">打开盒子会尝试播放，也可以直接点这里的 ▶。</p></section><button type="button" class="reset" id="reset" hidden>轻轻合上，下次再打开 ↻</button></div></section><p class="foot">2026 · 11 · 22<br>想念有自己的旋律，今天也想让你听见。</p></main><script>
(function(){'use strict';var notes=['喜欢你，不只是想说一句想你。\n还会想，你今天有没有遇到\n什么值得开心的小事。','有时看见一件很普通的东西，\n就会想起你说话时的小表情。\n然后，自己也跟着笑一下。','想把今天的这点温柔留给你。\n不催你回复，\n你有空打开的时候，它就在这里。'];var index=-1,stage=document.getElementById('stage'),words=document.getElementById('words'),turn=document.getElementById('turn'),open=document.getElementById('open'),reset=document.getElementById('reset'),music=document.getElementById('music'),status=document.getElementById('status');function fail(){status.textContent='这次没有播起来，请点上方 ▶ 重试，并检查手机音量。'}function startMusic(){try{var p=music.play();if(p&&p.catch)p.catch(fail)}catch(e){fail()}}open.addEventListener('click',function(){var first=index===-1;index=(index+1)%notes.length;stage.classList.add('open');words.textContent=notes[index];turn.textContent='第 '+(index+1)+' / 3 段心里话';open.textContent=index===2?'再转一圈，重听这些心里话 ↻':'转一圈，再看一句 ♡';reset.hidden=false;if(first)startMusic()});music.addEventListener('playing',function(){status.textContent='正在播放 · 音乐轻轻，想念慢慢';});music.addEventListener('pause',function(){status.textContent='音乐已暂停 · 点 ▶ 可以继续听';});music.addEventListener('error',fail);music.addEventListener('waiting',function(){status.textContent='音乐正在加载，稍等一下…'});reset.addEventListener('click',function(){index=-1;stage.classList.remove('open');words.textContent='盒子里装的不是什么大惊喜，\n是今天又想起你的几个瞬间。';turn.textContent='心意八音盒 · 还没有打开';open.textContent='打开八音盒，听听音乐 ♡';reset.hidden=true;music.pause();open.focus()});document.addEventListener('visibilitychange',function(){if(document.hidden)music.pause()});window.addEventListener('pagehide',function(){music.pause()})})();
</script></body></html>
