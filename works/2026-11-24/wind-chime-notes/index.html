(function(){'use strict';var notes=['醒来想起你，\n会想给你留一句早安。\n不是什么特别的话，就是想和你说说话。','买东西的时候，\n偶尔还是会顺手看看你爱吃的那一排。\n人不在身边，惦记的习惯还在。','下次见面，想和你找个地方坐坐，\n聊聊最近吃过什么、看过什么，\n把没能一起过的日常，慢慢讲给对方听。'];var names=['一张早安纸签','一张日常纸签','一张见面纸签'],tags=Array.prototype.slice.call(document.querySelectorAll('.tag')),words=document.getElementById('words'),label=document.getElementById('label'),breeze=document.getElementById('breeze'),next=0;function show(i){tags.forEach(function(t,j){t.setAttribute('aria-pressed',String(i===j));t.classList.remove('sway')});void tags[i].offsetWidth;tags[i].classList.add('sway');words.textContent=notes[i];label.textContent=names[i]+' · 给晓晓';next=(i+1)%notes.length}tags.forEach(function(tag,i){tag.addEventListener('click',function(){show(i)})});breeze.addEventListener('click',function(){show(next)});var music=document.getElementById('music'),status=document.getElementById('music-status');music.addEventListener('playing',function(){status.textContent='正在播放 · 今天也想温柔地陪着你'});music.addEventListener('pause',function(){status.textContent='音乐已暂停 · 点 ▶ 继续听'});music.addEventListener('error',function(){status.textContent='音乐暂未加载成功，请点播放器重试。'});document.addEventListener('visibilitychange',function(){if(document.hidden)music.pause()});window.addEventListener('pagehide',function(){music.pause()})})();
