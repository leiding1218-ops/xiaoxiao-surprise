</style></head><body><main><a class="back" href="../../../">← 返回心意合集</a><section class="card"><header class="head"><p class="eyebrow">今 日 班 次 · 只 装 心 意</p><h1>晓晓，想念小列车开向你</h1><p class="intro">这趟小列车没有拥挤的行李，<br>只有几句想带到你身边的话。</p></header><div class="scene" id="scene" aria-hidden="true"><div class="cloud"></div><div class="cloud two"></div><div class="hill"></div><div class="hill two"></div><div class="track"></div><div class="train" id="train"><div class="roof"></div><div class="windows"><span>♡</span><span>♡</span></div></div></div><div class="route" aria-label="三站心意旅程"><span class="stop on">想起你</span><span class="stop">沿途惦记</span><span class="stop">靠近你</span></div><div class="ticket"><div><div class="stamp" id="stamp">第 1 站 · 想起你</div><p id="words">出门前会检查钥匙和手机，<br>也会想一想，今天要和你分享什么。</p></div></div><div class="buttons"><button type="button" id="go">带上这句想念，出发 ♡</button></div></section><p class="foot">2026 · 10 · 29<br>路途可以慢一点，喜欢会好好带着。</p></main><script>
(function(){'use strict';var notes=['出门前会检查钥匙和手机，\n也会想一想，今天要和你分享什么。','路上的风景各有各的好，\n但能和你说一句“你看”，才更有意思。','想把隔着屏幕的晚安，\n慢慢换成并肩散步时，轻轻牵住你的手。'];var titles=['想起你','沿途惦记','靠近你'],positions=['5%','36%','66%'],index=0,busy=false,timer=null,train=document.getElementById('train'),scene=document.getElementById('scene'),stamp=document.getElementById('stamp'),words=document.getElementById('words'),go=document.getElementById('go'),stops=Array.prototype.slice.call(document.querySelectorAll('.stop'));function render(){words.textContent=notes[index];stamp.textContent='第 '+(index+1)+' 站 · '+titles[index];stops.forEach(function(s,i){s.classList.toggle('on',i<=index)});go.textContent=index===2?'再坐一次想念小列车 ↻':index===1?'带上沿途的惦记，继续走 ♡':'带上这句想念，出发 ♡'}function arrive(){scene.classList.remove('moving');busy=false;go.disabled=false;timer=null;render()}go.addEventListener('click',function(){if(busy)return;if(index===2){index=0;train.style.left=positions[0];render();return}index++;busy=true;go.disabled=true;go.textContent='小列车正慢慢向前…';scene.classList.add('moving');train.style.left=positions[index];timer=setTimeout(arrive,1400)});document.addEventListener('visibilitychange',function(){if(document.hidden&&busy){clearTimeout(timer);arrive()}});window.addEventListener('pagehide',function(){if(busy){clearTimeout(timer);arrive()}})})();
