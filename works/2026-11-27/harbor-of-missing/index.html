<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#dfe9ea"><title>想念靠岸 · 给晓晓</title><style>
*{box-sizing:border-box}body{margin:0;background:#dfe9ea;color:#344c52;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding:32px 20px calc(28px + env(safe-area-inset-bottom))}main{max-width:440px;margin:auto}.eyebrow{font-size:11px;letter-spacing:4px;color:#788e92}h1{font-family:Georgia,"Songti SC",serif;font-size:32px;line-height:1.5;font-weight:500;margin:18px 0 12px}.intro{font-size:15px;line-height:1.9;color:#647b80;margin-bottom:24px}.harbor{border-radius:27px;overflow:hidden;position:relative;background:#f2eee3;border:1px solid #c0d0d1}.scene{display:block;width:100%;height:auto}#boat{transform:translateX(0);transition:transform .3s ease-out}.bob{animation:bob 3s ease-in-out infinite}.ripple{animation:ripple 4s ease-in-out infinite;transform-origin:center}.lamp{fill:#b8b7a4;transition:fill .5s}.arrived .lamp{fill:#f2c373}.message{background:#f9f8f0;padding:24px 22px;min-height:220px}.message h2{font-size:18px;font-weight:500;margin:0 0 12px;line-height:1.6}.message p{font-size:16px;line-height:2;margin:0;white-space:pre-line;color:#577079}.controls{padding:20px 3px 8px}.controls label{font-size:14px;line-height:1.8;display:block}input{width:100%;height:44px;accent-color:#658e95;margin:7px 0;cursor:pointer}.hint{font-size:12px;color:#748c92;margin:0 0 15px;line-height:1.8}.actions{display:flex;gap:10px}button{font-family:inherit;font-size:14px;min-height:46px;padding:11px 18px;border-radius:14px;border:1px solid #9cb6bb;background:#537c84;color:#fff;cursor:pointer;flex:1}button.secondary{background:transparent;color:#526f76}button:disabled{opacity:.7;cursor:default}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #a6764b;outline-offset:4px}.music{margin-top:24px;border-top:1px solid #b9cdcf;padding-top:17px}.music label{font-size:13px;display:block;margin-bottom:10px}audio{width:100%;height:42px;display:block}.music p{font-size:11px;line-height:1.8;color:#70878c;margin:8px 0}footer{margin-top:26px;text-align:center;font-size:12px;line-height:2;color:#70878c}footer a{color:#526f76;text-underline-offset:5px}.date{font-size:10px;letter-spacing:2px;display:block;margin-top:11px}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}@keyframes ripple{0%,100%{opacity:.4}50%{opacity:.8}}@media(prefers-reduced-motion:reduce){.bob,.ripple{animation:none}#boat{transition:none}}@media(max-width:350px){h1{font-size:28px}body{padding-left:14px;padding-right:14px}}
</style></head><body><main><p class="eyebrow">给 你 一 个 安 心 的 位 置</p><h1>晓晓，让我的想念<br>在你身边靠个岸。</h1><p class="intro">有时候，好想把距离缩短一点。<br>不用说很多话，能陪在你身边就好。<br>今天，先让这只小船替我慢慢靠近你。</p>
<section class="harbor" id="harbor" aria-label="想念的小船"><svg class="scene" viewBox="0 0 400 250" role="img" aria-label="一只小船驶向亮着暖灯的码头"><path fill="#e8eee8" d="M0 0h400v250H0z"/><circle cx="76" cy="48" r="23" fill="#f2d8a4"/><path d="M0 122Q65 99 135 124T280 119T400 111V250H0Z" fill="#9ebfc0"/><path d="M0 164Q90 145 188 167T400 157V250H0Z" fill="#81a8ad"/><g fill="none" stroke="#d5e2dc" stroke-width="2" stroke-linecap="round" class="ripple"><path d="M22 186h42m45 29h38m40-30h48m62 38h37M30 231h27m120 5h34"/></g><path d="M318 145h82v9h-82zM328 154h7v53h-7zM379 154h7v53h-7z" fill="#88795f"/><path d="M358 139V79" stroke="#697e74" stroke-width="4"/><path d="M347 91h22V72h-22z" class="lamp"/><path d="m344 72 14-12 14 12Z" fill="#697e74"/><g id="boat"><g class="bob"><path d="M23 159h71l-13 17H37z" fill="#faf1d9"/><path d="M57 159V102" stroke="#7b725b" stroke-width="3"/><path d="M54 108 28 149h26z" fill="#ecd29d"/><path d="M62 113v36h24z" fill="#f9f5e9"/><path d="M36 184q22 5 45 0" stroke="#c7dcdb" stroke-width="2" fill="none"/></g></g><text x="305" y="236" font-size="11" fill="#ecf0e7" font-family="sans-serif">给晓晓的港湾</text></svg>
<div class="message" aria-live="polite" aria-atomic="true"><h2 id="heading">小船上，放着今天的心里话。</h2><p id="words">拖动下面的滑杆，或点“靠近一点”。<br>不用赶路，让它慢慢来。</p></div></section>
<div class="controls"><label for="sail">让小船靠岸 <span id="progress">0%</span></label><input id="sail" type="range" min="0" max="100" step="1" value="0" aria-valuetext="尚未启程"><p class="hint" id="hint">沿途有三段心里话，靠近一点，就能看见。</p><div class="actions"><button id="closer" type="button">靠近一点 →</button><button class="secondary" id="again" type="button">重新启程</button></div></div>
<div class="music"><label for="music">♫ 点 ▶，配一点轻音乐</label><audio id="music" controls loop playsinline preload="metadata"><source src="../../../assets/soft-evening.mp3" type="audio/mpeg">此浏览器不支持音频播放。</audio><p id="music-status">音乐由你手动开启，随时都可以暂停。</p></div><footer>今天，也在认真想你。<br><a href="../../../">返回我们的心意合集</a><span class="date">2026.11.27 · 想念靠岸</span></footer></main>
<script>(function(){'use strict';var sail=document.getElementById('sail'),closer=document.getElementById('closer');var titles=['小船上，放着今天的心里话。','有些想念，藏在很小的瞬间里。','你可以在我面前，放松一点。','晓晓，我的心里一直留着你的位置。'];var notes=['拖动下面的滑杆，或点“靠近一点”。\n不用赶路，让它慢慢来。','忙着忙着，忽然就想起你的声音。\n很想叫你一声老婆，\n再听你随口应我一句。','不用每次都把话想好了才告诉我。\n开心的、烦心的，或者一时说不清的，\n我都想听你慢慢讲。','想说话的时候，我愿意听。\n想安静的时候，也不用勉强自己找话题。\n我喜欢你，也想让你和我相处时觉得轻松。'];function render(){var v=Math.max(0,Math.min(100,Number(sail.value)));var stage=v>=100?3:v>=60?2:v>=25?1:0;document.getElementById('boat').style.transform='translateX('+(v*2.22)+'px)';document.getElementById('harbor').classList.toggle('arrived',v>=100);document.getElementById('progress').textContent=v+'%';document.getElementById('heading').textContent=titles[stage];document.getElementById('words').textContent=notes[stage];sail.setAttribute('aria-valuetext',v+'%，'+titles[stage]);closer.textContent=v>=100?'已经靠岸 ♡':'靠近一点 →';closer.disabled=v>=100;document.getElementById('hint').textContent=v>=100?'靠岸了。这份惦记，留在这里陪你。':'沿途有三段心里话，靠近一点，就能看见。';}sail.addEventListener('input',render);sail.addEventListener('change',render);closer.addEventListener('click',function(){var v=Number(sail.value);sail.value=v<25?25:v<60?60:100;render();});document.getElementById('again').addEventListener('click',function(){sail.value=0;render();});var music=document.getElementById('music'),status=document.getElementById('music-status');music.addEventListener('playing',function(){status.textContent='轻音乐播放中 · 随时可以暂停';});music.addEventListener('pause',function(){status.textContent='音乐已暂停 · 想听时再点 ▶';});music.addEventListener('error',function(){status.textContent='音乐暂时没有加载出来，可以稍后重试；心里话仍可正常查看。';});document.addEventListener('visibilitychange',function(){if(document.hidden)music.pause();});window.addEventListener('pagehide',function(){music.pause();});})();</script></body></html>
