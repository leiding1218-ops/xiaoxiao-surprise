</style></head><body><main><a class="back" href="../../../">← 返回心意合集</a><section class="card"><header class="head"><p class="eyebrow">距 离 远 一 点 · 惦 记 近 一 点</p><h1>晓晓，给你一个隔空拥抱</h1><p class="intro">暂时不能伸手抱到你，<br>就先把这份暖暖的惦记放在这里。</p></header><div class="scene" id="scene" aria-hidden="true"><div class="halo"></div><span class="heart">♥</span><div class="arm left"></div><div class="arm right"></div><span class="spark s1">♡</span><span class="spark s2">♡</span><span class="spark s3">✧</span><span class="caption" id="caption">一 个 小 拥 抱 · 等 你 收 下</span></div><div class="body"><div class="message" role="status" aria-live="polite"><p id="words">今天先不说很长的话，<br>只想轻轻抱你一下。</p></div><button class="button" id="hug" type="button">收下这个小拥抱 ♡</button><button class="reset" id="reset" type="button" hidden>把这份拥抱重新打开 ↻</button><p class="hint" id="hint">点一下，小手会慢慢靠拢。<br>有些喜欢，轻轻的也很认真。</p></div></section><p class="foot">2026 · 11 · 21<br>给晓晓的小心意</p></main><script>
