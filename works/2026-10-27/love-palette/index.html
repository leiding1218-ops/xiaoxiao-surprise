<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#f4eef9"><title>晓晓，把喜欢调成你的颜色</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{--a:#e7a8b5;--b:#b9b0df;--wash:#f4eef9;margin:0;background:linear-gradient(160deg,var(--wash),#fff8ee);color:#66556d;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;padding:calc(18px + env(safe-area-inset-top)) 18px calc(26px + env(safe-area-inset-bottom));transition:background .6s}main{max-width:470px;margin:auto}.back{display:inline-block;font-size:14px;color:#8a7891;text-decoration:none;padding:12px 0}.card{border:1px solid #fff;border-radius:30px;background:#ffffffbf;box-shadow:0 18px 45px #82709412;padding:28px 20px;text-align:center}.eyebrow{font-size:11px;letter-spacing:4px;color:#a18ca8;margin:0 0 12px}h1{font:500 28px/1.6 Georgia,"Songti SC",serif;margin:0 0 12px}.intro{font-size:14px;line-height:1.9;color:#96839b;margin:0}.art{position:relative;height:190px;margin:18px auto 0;display:grid;place-items:center}.halo{position:absolute;width:180px;height:180px;border-radius:50%;background:linear-gradient(130deg,var(--a),var(--b));opacity:.14;filter:blur(12px);transition:background .5s}.heart{width:110px;height:110px;transform:rotate(-45deg);background:linear-gradient(135deg,var(--a),var(--b));position:relative;margin-top:30px;box-shadow:-12px 18px 26px #957a9c1c;opacity:.45;transition:opacity .6s,background .6s}.heart:before,.heart:after{content:"";width:110px;height:110px;background:inherit;border-radius:50%;position:absolute}.heart:before{top:-55px;left:0}.heart:after{left:55px;top:0}.art.mixed .heart{opacity:1;animation:heartbeat 1s ease}.spark{position:absolute;color:#b38eaf;font-size:20px;opacity:0;pointer-events:none}.s1{left:12%;top:40px}.s2{right:14%;top:23px}.s3{right:9%;bottom:35px}.mixed .spark{animation:rise 2s ease both}.mixed .s2{animation-delay:.25s}.mixed .s3{animation-delay:.5s}.palette{display:flex;justify-content:center;gap:10px;margin:20px 0 14px}.swatch{flex:1;max-width:110px;min-height:92px;border:1px solid #e7dfea;background:#fffcff;border-radius:19px;color:#75647a;font:14px/1.7 inherit;cursor:pointer;padding:10px 4px;touch-action:manipulation}.dot{display:block;width:32px;height:32px;border-radius:50%;margin:0 auto 7px;background:var(--color);box-shadow:inset 0 0 0 4px #ffffff77}.swatch[aria-pressed="true"]{border:2px solid #a489ad;background:#f4eef7;padding:9px 3px}.swatch[aria-pressed="true"] .dot:after{content:"✓";display:block;color:#57435d;line-height:32px;font-size:18px}.hint{font-size:12px;color:#9b89a1;line-height:1.8;min-height:22px;margin:0 0 17px}.mix{width:100%;min-height:48px;border:0;border-radius:24px;background:#92759c;color:white;font:500 15px/1.5 -apple-system,"PingFang SC",sans-serif;padding:13px;cursor:pointer}.mix:disabled{background:#d7cbdc;color:#74637a;cursor:default}.message{min-height:120px;display:grid;place-items:center;margin-top:21px;padding:18px 12px;border-radius:20px;background:#fffaf4;border:1px solid #ebe0df}.message p{margin:0;font:18px/1.9 Georgia,"Songti SC",serif;white-space:pre-line}.label{font-size:12px;color:#a384a7;letter-spacing:2px;margin:14px 0 0;min-height:20px}.reset{background:none;border:0;border-bottom:1px solid #c7b4cb;color:#967c9c;font-size:13px;padding:9px 2px;cursor:pointer;margin-top:12px;min-height:42px}button:focus-visible,a:focus-visible{outline:3px solid #896d93;outline-offset:4px}.foot{font-size:11px;line-height:1.9;color:#aa9bac;margin:19px 0 0}@keyframes heartbeat{50%{transform:rotate(-45deg) scale(1.1)}100%{transform:rotate(-45deg)}}@keyframes rise{0%{opacity:0;transform:translateY(12px)}40%{opacity:.8}100%{opacity:0;transform:translateY(-25px)}}@media(max-width:350px){.card{padding:25px 15px}h1{font-size:24px}.palette{gap:6px}.message p{font-size:17px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body><main><a class="back" href="../../../">← 返回心意合集</a><section class="card"><p class="eyebrow">今 天 的 喜 欢 · 由 你 调 色</p><h1>晓晓，把喜欢调成你的颜色</h1><p class="intro">选两种心意，轻轻调在一起。<br>看看今天的喜欢，会是什么颜色。</p><div class="art" id="art" aria-hidden="true"><div class="halo"></div><div class="heart"></div><span class="spark s1">♡</span><span class="spark s2">✧</span><span class="spark s3">♡</span></div><div class="palette" role="group" aria-label="请选择两种心意颜色"><button class="swatch" type="button" aria-pressed="false" style="--color:#e7a8b5"><span class="dot" aria-hidden="true"></span>玫瑰色的想念</button><button class="swatch" type="button" aria-pressed="false" style="--color:#b9b0df"><span class="dot" aria-hidden="true"></span>薰衣草的偏爱</button><button class="swatch" type="button" aria-pressed="false" style="--color:#a8cfc7"><span class="dot" aria-hidden="true"></span>薄荷色的陪伴</button></div><p class="hint" id="hint" aria-live="polite">还没有选颜色 · 请选择两种</p><button class="mix" id="mix" type="button" disabled>先选两种心意 ♡</button><div class="message" role="status" aria-live="polite"><p id="words">调色盘已经准备好了，<br>就等你添一点今天的心情。</p></div><p class="label" id="label"></p><button class="reset" id="reset" type="button" hidden>清空调色盘，换一种搭配 ↻</button><p class="foot">2026 · 10 · 27<br>喜欢你的每一天，都有一点新的颜色。</p></section></main><script>
(function(){'use strict';var colors=['#e7a8b5','#b9b0df','#a8cfc7'],names=['想念','偏爱','陪伴'],washes=['#f8edf2','#f2edfa','#edf7f3'],notes={'0,1':['玫瑰与薰衣草','人群里有很多好看的颜色，\n可我想分享的那一眼，总是先找你。'],'0,2':['玫瑰与薄荷','想念是路过好吃的小店时，\n心里悄悄给你留了一个位置。'],'1,2':['薰衣草与薄荷','喜欢和你商量晚饭吃什么，\n也喜欢把平常的一天，慢慢过成两个人的日子。']};var selected=[],buttons=Array.prototype.slice.call(document.querySelectorAll('.swatch')),mix=document.getElementById('mix'),hint=document.getElementById('hint'),words=document.getElementById('words'),label=document.getElementById('label'),reset=document.getElementById('reset'),art=document.getElementById('art');function render(){buttons.forEach(function(b,i){b.setAttribute('aria-pressed',String(selected.indexOf(i)!==-1))});mix.disabled=selected.length!==2;mix.textContent=selected.length===2?'调出今天的喜欢 ♡':'再选'+(2-selected.length)+'种心意 ♡';hint.textContent=selected.length?selected.map(function(i){return names[i]}).join(' ＋ ')+(selected.length===1?' · 再选一种':' · 可以开始调色啦'):'还没有选颜色 · 请选择两种';art.classList.remove('mixed');words.textContent='调色盘已经准备好了，\n就等你添一点今天的心情。';label.textContent='';reset.hidden=selected.length===0}buttons.forEach(function(b,i){b.addEventListener('click',function(){var at=selected.indexOf(i);if(at!==-1)selected.splice(at,1);else{if(selected.length===2)selected.shift();selected.push(i)}render()})});mix.addEventListener('click',function(){if(selected.length!==2)return;var key=selected.slice().sort().join(','),note=notes[key];document.body.style.setProperty('--a',colors[selected[0]]);document.body.style.setProperty('--b',colors[selected[1]]);document.body.style.setProperty('--wash',washes[selected[0]]);words.textContent=note[1];label.textContent=note[0]+' · 给晓晓的专属配色';art.classList.remove('mixed');void art.offsetWidth;art.classList.add('mixed');hint.textContent='调好了，今天的喜欢请收下 ♡'});reset.addEventListener('click',function(){selected=[];render();document.body.style.setProperty('--a',colors[0]);document.body.style.setProperty('--b',colors[1]);document.body.style.setProperty('--wash','#f4eef9');mix.textContent='先选两种心意 ♡';buttons[0].focus()})})();
</script><script src="../../../music.js?v=20261023-1"></script></body></html>
