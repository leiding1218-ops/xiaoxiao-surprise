<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="description" content="给晓晓的一份小惊喜"><title>晓晓的惊喜盒</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(140deg,#fff0f5,#f3e7ff,#ffe9e0);font-family:-apple-system,"PingFang SC",sans-serif;color:#784a66;padding:20px}.card{max-width:410px;width:100%;padding:28px 20px;text-align:center;border-radius:28px;background:#ffffffed;box-shadow:0 15px 50px #d489a544}h1{font-size:25px}.box{font-size:78px;animation:bob 2s infinite}@keyframes bob{50%{transform:translateY(-9px)}}button{display:block;width:100%;border:0;border-radius:25px;background:#d9437a;color:white;font-size:18px;padding:16px;margin:12px 0;cursor:pointer;touch-action:manipulation}.secondary{background:#9465a8}#message{font-size:18px;line-height:1.9;min-height:140px;white-space:pre-line}.heart{position:fixed;bottom:0;pointer-events:none;animation:up 2.3s forwards}@keyframes up{to{transform:translateY(-105vh);opacity:0}}small{color:#8d6a7d}@media(prefers-reduced-motion:reduce){.box{animation:none}.heart{display:none}}</style></head><body><main class="card"><div class="box" id="box" aria-hidden="true">🎁</div><h1>晓晓，今天有份惊喜给你</h1><div id="message" aria-live="polite">有些话藏在小盒子里，<br>只等你亲手打开。💗</div><button id="open" type="button">拆开小惊喜盒 💌</button><button id="more" class="secondary" type="button">再给我一点甜蜜 ❤️</button><small>只属于晓晓的小小浪漫</small></main><script>(function(){var messages=[["晓晓，今天也好想你。","虽然我们不在同一个地方，","但我的心一直向着你。❤️"],["等下次见面，","我要把今天欠你的拥抱，","一次一次全部补回来。💕"],["我喜欢的未来很简单：","有你，有笑声，","还有好多平凡却幸福的日子。🌷"]];var index=0;function show(a){document.getElementById("message").textContent=a.join(String.fromCharCode(10))}function hearts(){for(var i=0;i<15;i++){var e=document.createElement("span");e.className="heart";e.textContent=i%2?"💕":"❤️";e.setAttribute("aria-hidden","true");e.style.left=Math.random()*90+"vw";e.style.fontSize=(18+Math.random()*20)+"px";document.body.appendChild(e);(function(n){setTimeout(function(){n.remove()},3000)})(e)}}document.getElementById("open").addEventListener("click",function(){document.getElementById("box").textContent="💝";show(messages[index++%messages.length]);hearts()});document.getElementById("more").addEventListener("click",function(){show(["收到啦，晓晓！","今天的爱又多了一点点。","明天、后天，也会继续爱你。💗"]);hearts()})})();</script><a href="../../../" aria-label="返回心意合集" style="position:fixed;top:12px;left:12px;z-index:10;background:#fffaf3ef;border:1px solid #ddc8b8;border-radius:24px;padding:10px 14px;color:#725749;font:14px -apple-system,sans-serif;text-decoration:none">← 心意合集</a><script src="../../../music.js?v=20261023-1"></script></body></html>
