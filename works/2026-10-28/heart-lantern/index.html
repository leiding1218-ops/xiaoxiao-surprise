<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#193d42"><title>晓晓，为你放一盏心意天灯</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:radial-gradient(ellipse at top,#2d5960,#183a40 60%,#122d35);color:#faf0db;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;padding:calc(18px + env(safe-area-inset-top)) 18px calc(28px + env(safe-area-inset-bottom))}main{max-width:460px;margin:auto}.back{display:inline-block;color:#c1d1cc;text-decoration:none;font-size:14px;padding:12px 0}.card{background:#ffffff08;border:1px solid #c7dfd326;border-radius:28px;overflow:hidden;text-align:center;box-shadow:0 20px 50px #00171e30}.header{padding:28px 20px 0}.eyebrow{font-size:11px;letter-spacing:4px;color:#a9c4be;margin:0 0 12px}h1{font:500 28px/1.6 Georgia,"Songti SC",serif;margin:0 0 12px}.intro{font-size:14px;color:#b9cdc6;line-height:1.9;margin:0}.sky{height:252px;position:relative;overflow:hidden;margin:12px 0 0;background-image:radial-gradient(#f3e5bc88 1px,transparent 1px);background-size:49px 57px}.moon{width:30px;height:30px;border-radius:50%;box-shadow:8px 4px 0 #ede5c2;position:absolute;right:53px;top:20px;transform:rotate(-20deg)}.lantern{position:absolute;width:102px;height:132px;left:calc(50% - 51px);bottom:33px;border-radius:40% 40% 28% 28%;background:linear-gradient(90deg,#be8554,#e7b879 45%,#bd8152);border:1px solid #e5ba7d;box-shadow:0 0 40px #e8b45f22;opacity:.6;transition:opacity .4s,filter .4s,box-shadow .4s;transform-origin:50% 100%}.lantern:before{content:"";position:absolute;inset:8px 19px;border-left:1px solid #ffedb95e;border-right:1px solid #ffedb95e;border-radius:50%}.lantern:after{content:"";position:absolute;width:53px;height:10px;bottom:-5px;left:23px;background:#794e36;border:2px solid #d1a26b;border-radius:50%}.heart{position:absolute;left:0;right:0;top:42px;color:#fff4cf;font-size:33px}.flame{position:absolute;width:13px;height:21px;background:#fff0b5;border-radius:70% 30% 60% 40%;left:43px;bottom:10px;opacity:0;box-shadow:0 0 19px #ffe4a2}.ready .flame{opacity:1;animation:flame 1.6s ease-in-out infinite}.ready .lantern{box-shadow:0 0 70px #f5c57066;opacity:1}.flying .lantern{animation:fly 4.5s ease-in forwards}.ground{position:absolute;bottom:0;left:-10%;width:120%;height:24px;background:#0a2935;border-radius:50% 50% 0 0}.body{padding:0 22px 25px}.message{min-height:110px;padding:16px 10px;display:grid;place-items:center;background:#0d2c344d;border:1px solid #b5d0c51f;border-radius:20px}.message p{font:18px/1.9 Georgia,"Songti SC",serif;margin:0;white-space:pre-line}.label{display:block;font-size:12px;color:#b3c6bd;margin:20px 0 8px}.range{width:100%;height:30px;accent-color:#e3b77b;cursor:pointer;touch-action:pan-y}.buttons{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}button{min-height:47px;border:1px solid #b3c9bb55;border-radius:23px;padding:12px 15px;background:#ffffff08;color:#d9e1ce;font:500 14px/1.5 -apple-system,"PingFang SC",sans-serif;cursor:pointer;touch-action:manipulation}.launch{flex:1;min-width:145px;background:#e7bc82;color:#34484a;border-color:#e7bc82}button:disabled{opacity:.45;cursor:default}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #f2d49b;outline-offset:4px}.reset{margin-top:18px;background:transparent;border:0;border-bottom:1px solid #93ada466;border-radius:0;color:#b7cbc3;padding:7px 3px}.hint{font-size:11px;line-height:1.9;color:#9bb7b0;margin:19px 0 0}@keyframes flame{50%{transform:scale(.85) rotate(7deg)}}@keyframes fly{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(38px,-245px) scale(.35);opacity:0}}@media(max-width:350px){h1{font-size:24px}.body{padding:0 15px 23px}.message p{font-size:17px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}.flying .lantern{transform:translate(28px,-100px) scale(.55);opacity:.35}}
</style></head><body><main><a class="back" href="../../../">← 返回心意合集</a><section class="card"><header class="header"><p class="eyebrow">一 点 暖 光 · 一 份 惦 念</p><h1>晓晓，为你放一盏心意天灯</h1><p class="intro">把灯慢慢点亮，<br>让今天的心意，轻轻向你靠近。</p></header><div class="sky" id="sky" aria-hidden="true"><div class="moon"></div><div class="lantern" id="lantern"><span class="heart">♡</span><span class="flame"></span></div><div class="ground"></div></div><div class="body"><div class="message" role="status" aria-live="polite"><p id="words">给平常的一天，<br>添一点想起你时的暖意。</p></div><label for="light" class="label" id="label">天灯亮度 · 0%</label><input class="range" id="light" type="range" min="0" max="100" step="1" value="0" aria-valuetext="天灯亮度 0%，可滑动或点击添一点暖光"><div class="buttons"><button type="button" id="warm">添一点暖光 ＋</button><button type="button" class="launch" id="launch" disabled>点亮后，放飞心意 ♡</button></div><button type="button" class="reset" id="reset" hidden>再点亮一盏心意天灯 ↻</button><p class="hint">滑动亮度，或点按钮添光，亮满就可以放飞。<br>2026 · 10 · 28 · 愿你今天也被温柔照顾</p></div></section></main><script>
(function(){'use strict';var light=document.getElementById('light'),label=document.getElementById('label'),warm=document.getElementById('warm'),launch=document.getElementById('launch'),words=document.getElementById('words'),sky=document.getElementById('sky'),lantern=document.getElementById('lantern'),reset=document.getElementById('reset'),sent=false,timer=null;function update(){if(sent)return;var v=Number(light.value);label.textContent='天灯亮度 · '+v+'%';light.setAttribute('aria-valuetext','天灯亮度 '+v+'%');lantern.style.opacity=String(.45+v*.0055);sky.classList.toggle('ready',v===100);launch.disabled=v!==100;warm.disabled=v===100;launch.textContent=v===100?'让这份心意升起 ♡':'点亮后，放飞心意 ♡';words.textContent=v===100?'灯已经亮了，\n里面装着一句：有你在，日子就值得期待。':v>=50?'我喜欢的幸福很小，\n是你随口说起的事，我都想认真听。':v>0?'希望今天的你，\n有热乎的饭，也有轻松的心情。':'给平常的一天，\n添一点想起你时的暖意。'}light.addEventListener('input',update);warm.addEventListener('click',function(){light.value=String(Math.min(100,Number(light.value)+25));update()});launch.addEventListener('click',function(){if(sent||Number(light.value)!==100)return;sent=true;launch.disabled=true;light.disabled=true;warm.disabled=true;launch.textContent='心意正在慢慢升起…';sky.classList.add('flying');words.textContent='晓晓，想把你放进每一个小计划里，\n一起吃饭，一起散步，一起慢慢过日子。';timer=setTimeout(function(){launch.textContent='今天的心意，已轻轻放飞';reset.hidden=false;timer=null},4500)});reset.addEventListener('click',function(){if(timer!==null){clearTimeout(timer);timer=null}sent=false;sky.classList.remove('flying');light.disabled=false;light.value='0';reset.hidden=true;update();warm.focus()});window.addEventListener('pagehide',function(){if(timer!==null){clearTimeout(timer);timer=null;if(sent){launch.textContent='今天的心意，已轻轻放飞';reset.hidden=false}}});update()})();
</script><script src="../../../music.js?v=20261023-1"></script></body></html>
