*{box-sizing:border-box}body{margin:0;background:#eff1e8;color:#4b5a46;min-height:100vh;min-height:100svh;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding:22px 20px 36px}main{max-width:440px;margin:auto}a{display:inline-block;color:#74806b;font-size:13px;padding:10px 0;text-decoration:none}.date{text-align:center;font-size:11px;letter-spacing:3px;margin:28px 0 15px;color:#8a947d}h1{text-align:center;font:500 30px/1.6 Georgia,"Songti SC",serif;margin:0}.sub{text-align:center;color:#87917d;font-size:14px;line-height:1.9}.scene{height:220px;position:relative;display:flex;align-items:center;justify-content:center}.cup{width:130px;height:100px;background:#fffdf5;border:3px solid #b8c0a8;border-radius:9px 9px 49px 49px;position:relative;overflow:hidden;z-index:2}.handle{position:absolute;border:9px solid #b8c0a8;width:47px;height:50px;border-radius:50%;left:calc(50% + 49px);top:81px}.tea{position:absolute;bottom:0;left:0;width:100%;height:0;background:#c9ad70;transition:height .8s}.tea:before{content:"";position:absolute;top:-6px;left:-10%;width:120%;height:12px;border-radius:50%;background:#d7c38e}.cup-heart{position:absolute;top:32px;left:49px;color:#a4ae95;font-size:25px;z-index:3}.saucer{position:absolute;width:190px;height:15px;background:#d6dccb;border-radius:50%;top:162px}.leaf{position:absolute;top:46px;left:calc(50% - 15px);font-size:28px;opacity:0;z-index:4;transition:opacity .5s,transform .7s}.steam{position:absolute;top:15px;left:calc(50% - 33px);font-size:45px;letter-spacing:6px;color:#a0ac93;opacity:0;transition:opacity .5s;animation:rise 3s ease-in-out infinite}.scene.ready .steam{opacity:.7}.card{background:#fffcf5;border-radius:25px;border:1px solid #fff;padding:25px 22px;box-shadow:0 15px 35px #727f5d0b}#note{white-space:pre-line;text-align:center;font-size:16px;line-height:2;min-height:105px;margin:0 0 22px}button{font:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;border:0}#action{width:100%;border-radius:28px;padding:16px 10px;background:#7d8b6b;color:white;font-size:16px}.progress{text-align:center;font-size:12px;color:#98a08c;margin-top:18px}#again{display:block;background:none;padding:10px;margin:12px auto 0;color:#8a947d;font-size:13px}footer{text-align:center;font-size:12px;line-height:1.9;color:#8f9983;margin:25px 0}button:focus-visible,a:focus-visible{outline:3px solid #8b9877;outline-offset:4px}.heart{position:fixed;color:#b39a7a;pointer-events:none;font-size:23px;animation:fly 2.5s ease-out forwards}@keyframes rise{50%{transform:translateY(-9px);opacity:.3}}@keyframes fly{to{transform:translateY(-130px);opacity:0}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.heart{display:none}}@media(max-height:720px){.scene{height:190px}.date{margin-top:14px}}
</style></head><body><main><a href="../../../">← 回到心意收藏</a><p class="date">2026.10.21 · 一杯小心意</p><h1>晓晓，给你泡一杯想念</h1><p class="sub">把说不完的喜欢，<br>放进这一小会儿的陪伴里。</p><div class="scene" id="scene" role="img" aria-label="随着点击慢慢泡好的一杯茶"><span class="steam" aria-hidden="true">〰</span><span class="leaf" id="leaf" aria-hidden="true">🍃</span><div class="handle"></div><div class="cup"><div class="tea" id="tea"></div><span class="cup-heart" aria-hidden="true">♡</span></div><div class="saucer"></div></div><section class="card"><p id="note" role="status" aria-live="polite" aria-atomic="true">晓晓，早安。

今天的想念，我慢慢泡给你。</p><button id="action" type="button">放一片喜欢的茶叶 🍃</button><p class="progress" id="progress">给自己留一点不赶时间的空隙</p><button id="again" type="button" hidden>再泡一杯 ↻</button></section><footer>隔着距离，也想陪你过平常的日子。<br>不急，慢慢来就好。</footer></main><script>
(function(){var step=0,action=document.getElementById('action'),note=document.getElementById('note'),progress=document.getElementById('progress'),again=document.getElementById('again'),leaf=document.getElementById('leaf'),tea=document.getElementById('tea'),scene=document.getElementById('scene');
var words=['先放进一点喜欢。\n不是特别的日子，\n也想认真告诉你：\n今天，我还是很想你。','再添上一点陪伴。\n你想说话的时候，我愿意听。\n你想安静的时候，\n我们就一起安静一会儿。','最后，把心意轻轻端给你。\n愿今天有一件让你开心的小事。\n等见面了，\n我想坐在你旁边，陪你慢慢喝茶。'];
function hearts(){if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;for(var j=0;j<9;j++){var el=document.createElement('span');el.className='heart';el.textContent=j%2?'♡':'🍃';el.style.left=(20+Math.random()*60)+'vw';el.style.top=(40+Math.random()*40)+'vh';document.body.appendChild(el);(function(node){setTimeout(function(){if(node.parentNode)node.parentNode.removeChild(node)},2600)})(el)}}
action.onclick=function(){if(step>=3){hearts();return}note.textContent=words[step];step++;again.hidden=false;if(step===1){leaf.style.opacity='1';leaf.style.transform='translateY(55px) rotate(25deg)';action.textContent='添一点陪伴 🍵'}else if(step===2){tea.style.height='65px';leaf.style.opacity='0';scene.className='scene ready';action.textContent='把这一杯心意端给你 💗'}else{tea.style.height='78px';action.textContent='收下这杯想念 ♡';hearts()}progress.textContent=step===3?'喜欢、陪伴、想念，都在这一杯里':'已泡好 '+step+' / 3 份心意'};
again.onclick=function(){step=0;leaf.style.opacity='0';leaf.style.transform='';tea.style.height='0';scene.className='scene';note.textContent='晓晓，早安。\n先坐一小会儿，\n今天的想念，我慢慢泡给你。';action.textContent='放一片喜欢的茶叶 🍃';progress.textContent='给自己留一点不赶时间的空隙';again.hidden=true;action.focus()};
})();
</script></body></html>
