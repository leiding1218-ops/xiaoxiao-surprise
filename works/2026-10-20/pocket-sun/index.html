<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#fff2d8"><title>晓晓，送你一颗小太阳 ☀️</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100svh;background:linear-gradient(160deg,#fff5df,#ffe8cf);color:#735537;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding:22px 20px 36px;overflow-x:hidden}main{max-width:440px;margin:auto}a{display:inline-block;padding:10px 0;color:#94714e;font-size:13px;text-decoration:none}.date{text-align:center;font-size:11px;letter-spacing:3px;color:#a0815e;margin:30px 0 15px}h1{font-family:Georgia,"Songti SC",serif;font-weight:500;font-size:31px;line-height:1.6;text-align:center;margin:0}.sub{text-align:center;font-size:14px;color:#a0815e;line-height:1.9}.scene{height:245px;position:relative;display:flex;align-items:center;justify-content:center}.halo{width:180px;height:180px;border-radius:50%;background:#ffd37830;display:flex;align-items:center;justify-content:center;transition:background .5s,transform .5s}.sun{width:116px;height:116px;border-radius:50%;background:#f6bf54;box-shadow:0 0 0 14px #f6bf5418,0 0 0 30px #f6bf540c;position:relative;transition:transform .4s,box-shadow .4s}.eyes{position:absolute;top:44px;left:33px;width:8px;height:12px;background:#9b6d35;border-radius:50%;box-shadow:40px 0 #9b6d35}.smile{position:absolute;left:44px;top:63px;width:28px;height:15px;border-bottom:3px solid #9b6d35;border-radius:0 0 30px 30px}.blush{position:absolute;left:19px;top:64px;width:17px;height:8px;border-radius:50%;background:#eaa16f;box-shadow:60px 0 #eaa16f}.spark{position:absolute;font-size:24px;color:#c99b48;animation:twinkle 3s ease-in-out infinite}.s1{top:28px;left:45px}.s2{right:38px;top:71px;animation-delay:1s}.s3{bottom:27px;right:72px;font-size:17px;animation-delay:2s}.card{background:#fffcf5;border:1px solid #fff;border-radius:26px;padding:25px 23px;box-shadow:0 14px 35px #ac814714}#note{text-align:center;white-space:pre-line;font-size:17px;line-height:2;min-height:108px;margin:0 0 24px}button{font:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;border:0}#warm{width:100%;background:#c58d48;color:#fff;padding:16px 12px;border-radius:30px;font-size:16px;box-shadow:0 4px 0 #a7783d}#warm:active{transform:translateY(2px);box-shadow:0 2px 0 #a7783d}.dots{display:flex;justify-content:center;gap:10px;margin:24px 0 12px}.dot{width:9px;height:9px;border-radius:50%;background:#eadac2}.dot.on{background:#d5a24e}#status{text-align:center;color:#a0815e;font-size:12px;line-height:1.8;margin:0}#again{display:block;margin:18px auto 0;padding:8px;background:none;color:#987853;font-size:13px}footer{text-align:center;font-size:12px;line-height:1.9;color:#a48c71;margin-top:25px}button:focus-visible,a:focus-visible{outline:3px solid #ac804c;outline-offset:4px}.heart{position:fixed;pointer-events:none;color:#d09b65;animation:float 2.4s ease-out forwards;z-index:4}@keyframes twinkle{50%{opacity:.35;transform:scale(.8)}}@keyframes float{to{transform:translateY(-160px) rotate(20deg);opacity:0}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.heart{display:none}}@media(max-height:750px){.scene{height:200px}.date{margin-top:15px}}
</style></head><body><main><a href="../../../">← 回到心意收藏</a><p class="date">2026.10.20 · 今日暖意</p><h1>晓晓，送你一颗小太阳</h1><p class="sub">不用等晴天，<br>我也想给你一点暖。</p><div class="scene" role="img" aria-label="一颗笑眯眯的小太阳"><span class="spark s1" aria-hidden="true">✧</span><span class="spark s2" aria-hidden="true">✦</span><span class="spark s3" aria-hidden="true">✧</span><div class="halo" id="halo"><div class="sun" id="sun"><span class="eyes"></span><span class="smile"></span><span class="blush"></span></div></div></div><section class="card"><p id="note" role="status" aria-live="polite" aria-atomic="true">晓晓，早安。
今天的小太阳，
想住进你的口袋里。</p><button id="warm" type="button">收下一点暖意 ☀️</button><div class="dots" aria-hidden="true"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div><p id="status">轻轻点一下，让暖意靠近你</p><button id="again" type="button" hidden>再收一次小太阳 ↻</button></section><footer>普通的一天，也值得被好好喜欢。<br>这一份暖，留给你。</footer></main><script>
(function(){var step=0,button=document.getElementById('warm'),note=document.getElementById('note'),status=document.getElementById('status'),again=document.getElementById('again'),sun=document.getElementById('sun'),halo=document.getElementById('halo'),dots=document.querySelectorAll('.dot');
var words=['先给你一束轻轻的光。\n不催你起床，不催你赶路，\n只希望你今天过得舒服一点。','再给你一点好心情。\n遇到喜欢的小事，\n就替我也笑一下吧。','还有一份藏好的惦记。\n忙也好，闲也好，\n你都是我想分享日常的人。','晓晓，小太阳已经装好了。\n愿你心里有暖，身边有光。\n而我，今天也一样喜欢你。'];
function hearts(){if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;for(var j=0;j<12;j++){var el=document.createElement('span');el.className='heart';el.textContent=j%2?'♡':'✧';el.style.left=(15+Math.random()*70)+'vw';el.style.top=(45+Math.random()*35)+'vh';el.style.fontSize=(16+Math.random()*16)+'px';document.body.appendChild(el);(function(node){setTimeout(function(){if(node.parentNode)node.parentNode.removeChild(node)},2500)})(el)}}
button.onclick=function(){if(step>=4){hearts();return}note.textContent=words[step];dots[step].className='dot on';step++;sun.style.transform='scale('+(1+step*.035)+')';halo.style.background='rgba(255,203,103,'+(.12+step*.09)+')';status.textContent=step===4?'四份暖意，都留给晓晓了 💛':'已收下 '+step+' / 4 份暖意';button.textContent=step===4?'把小太阳放进口袋 💛':step===1?'再收一份好心情 ✨':step===2?'还有一份惦记 💌':'看看最后的小心意 💛';again.hidden=false;if(step===4)hearts()};
again.onclick=function(){step=0;note.textContent='晓晓，早安。\n今天的小太阳，\n想住进你的口袋里。';button.textContent='收下一点暖意 ☀️';status.textContent='轻轻点一下，让暖意靠近你';for(var i=0;i<dots.length;i++)dots[i].className='dot';sun.style.transform='scale(1)';halo.style.background='';again.hidden=true;button.focus()};
})();
</script></body></html>
