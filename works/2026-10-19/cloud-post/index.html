*{box-sizing:border-box}body{margin:0;color:#395366;background:linear-gradient(#dcebf5,#f6f4ed);min-height:100vh;min-height:100svh;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;padding:25px 20px 32px;overflow-x:hidden}main{max-width:450px;margin:auto;position:relative}.back{color:#587183;text-decoration:none;font-size:13px;display:inline-block;padding:10px 0}.date{font-size:11px;letter-spacing:3px;margin:28px 0 12px;color:#6e8797;text-align:center}h1{font-family:Georgia,"Songti SC",serif;text-align:center;font-size:32px;line-height:1.5;font-weight:500;margin:0}.sub{text-align:center;font-size:14px;line-height:1.9;color:#6e8797}.sky{height:134px;position:relative;margin-top:10px}.cloud{position:absolute;left:calc(50% - 65px);top:50px;width:130px;height:43px;background:#fff;border-radius:60px;box-shadow:0 14px 30px #6b96b519;animation:drift 4s ease-in-out infinite}.cloud:before,.cloud:after{content:"";position:absolute;background:white;border-radius:50%}.cloud:before{width:65px;height:65px;left:21px;top:-32px}.cloud:after{width:49px;height:49px;right:13px;top:-18px}.heartmark{position:absolute;left:calc(50% - 12px);top:67px;z-index:1;color:#d69393;font-size:23px}.tiny{position:absolute;color:#9db7c8;font-size:20px;right:45px;top:13px}.tiny.second{left:45px;top:96px}.postbox{background:#ffffffc9;border:1px solid #fff;border-radius:28px;padding:23px 18px;box-shadow:0 15px 45px #65849c10}.prompt{text-align:center;font-size:15px;margin:0 0 20px;line-height:1.8}.letters{display:flex;gap:10px;justify-content:center}button{font:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}button:focus-visible,a:focus-visible{outline:3px solid #6689a2;outline-offset:4px}.letter{width:31%;border:1px solid #d5e1e8;background:#eff5f9;border-radius:14px;padding:15px 4px 12px;color:#526f83;min-height:104px}.letter .icon{font-size:30px;display:block;margin-bottom:7px;transition:transform .3s}.letter[aria-pressed="true"]{background:#f9eee9;border-color:#dfc4b9;color:#947060}.letter[aria-pressed="true"] .icon{transform:translateY(-4px) rotate(-8deg)}.letter small{display:block;font-size:11px;margin-top:6px;color:#718390}.message{margin:22px 0 0;background:#fffcf6;border:1px solid #e9e1d3;border-radius:16px;padding:25px 18px;min-height:180px;white-space:pre-line;line-height:2;font-size:16px;text-align:center}.progress{text-align:center;color:#728795;font-size:12px;line-height:1.8;margin:17px 0 0;min-height:22px}.reset{display:block;margin:18px auto 0;background:transparent;border:0;font-size:13px;color:#6c8495;padding:10px}.footer{text-align:center;font-size:12px;line-height:1.9;color:#8495a1;margin:24px 0 0}.float{position:fixed;pointer-events:none;color:#d39797;font-size:22px;z-index:3;animation:rise 2.7s ease-out forwards}@keyframes rise{to{transform:translateY(-150px) rotate(20deg);opacity:0}}@keyframes drift{50%{transform:translateX(10px)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.float{display:none}}@media(max-width:350px){body{padding:18px 12px}.postbox{padding:20px 12px}h1{font-size:28px}}
</style></head><body><main><a class="back" href="../../../">← 回到心意收藏</a><p class="date">2026.10.19 · 今日来信</p><h1>晓晓的云朵邮局</h1><p class="sub">风替我绕了个远路，<br>把三封短信，送到了你这里。</p><div class="sky" aria-hidden="true"><span class="tiny">✧</span><span class="tiny second">✧</span><div class="cloud"></div><span class="heartmark">♥</span></div><section class="postbox" aria-label="三封寄给晓晓的信"><p class="prompt">晓晓，挑一封你想先看的吧 ☁️</p><div class="letters"><button class="letter" type="button" data-letter="0" aria-pressed="false"><span class="icon" aria-hidden="true">✉️</span>一声早安<small>点击拆信</small></button><button class="letter" type="button" data-letter="1" aria-pressed="false"><span class="icon" aria-hidden="true">✉️</span>一点惦记<small>点击拆信</small></button><button class="letter" type="button" data-letter="2" aria-pressed="false"><span class="icon" aria-hidden="true">✉️</span>一个拥抱<small>点击拆信</small></button></div><div class="message" id="message" role="status" aria-live="polite" aria-atomic="true">收件人：晓晓

// 可以在这里修改名字和三封信；无需外部图片、字体或脚本。
(function(){
var name='晓晓';
var notes=[
name+'，早安呀\n想把第一声问候留给你。\n愿你今天有好胃口、好心情，\n也有一点属于自己的轻松。',
'忙的时候，就安心忙吧。\n不用担心少说几句话，\n我对你的惦记，\n一直藏在这些平常的小事里。',
'隔着距离，先寄一个拥抱。\n等见面了，再认真抱抱你。\n今天累了就歇一会儿，\n你不必时时刻刻都很坚强。'
];
var opened=[false,false,false],buttons=document.querySelectorAll('.letter'),message=document.getElementById('message'),progress=document.getElementById('progress'),reset=document.getElementById('reset');
function hearts(button){if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;var rect=button.getBoundingClientRect();for(var j=0;j<7;j++){var heart=document.createElement('span');heart.className='float';heart.textContent=j%2?'♡':'♥';heart.style.left=(rect.left+rect.width/2+(Math.random()-.5)*90)+'px';heart.style.top=(rect.top+10+Math.random()*35)+'px';document.body.appendChild(heart);(function(node){setTimeout(function(){if(node.parentNode)node.parentNode.removeChild(node)},2800)})(heart)}}
for(var i=0;i<buttons.length;i++){(function(index){buttons[index].onclick=function(){opened[index]=true;for(var k=0;k<buttons.length;k++)buttons[k].setAttribute('aria-pressed',k===index?'true':'false');buttons[index].querySelector('small').textContent='已读 · 可重看';message.textContent=notes[index];var total=opened.filter(function(v){return v}).length;progress.textContent=total===3?'三封信都送到了，想念也送到了 💗':'已拆 '+total+' / 3 封 · 每一封都可以再看';reset.hidden=false;hearts(buttons[index])}})(i)}
reset.onclick=function(){opened=[false,false,false];for(var k=0;k<buttons.length;k++){buttons[k].setAttribute('aria-pressed','false');buttons[k].querySelector('small').textContent='点击拆信'}message.textContent='收件人：'+name+'\n寄件人：想你的我\n\n有些话不长，\n却想亲口说给你听。';progress.textContent='还有 3 封小小的想念，等你拆开';reset.hidden=true;buttons[0].focus()};
})();
