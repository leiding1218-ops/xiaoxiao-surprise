*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:linear-gradient(150deg,#fcf0d5,#dfece6);color:#6d6852;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding:calc(18px + env(safe-area-inset-top)) 18px calc(28px + env(safe-area-inset-bottom))}main{max-width:460px;margin:auto}.back{display:inline-block;padding:12px 0 18px;color:#929478;font-size:14px;text-decoration:none}.card{text-align:center;border:1px solid #fff;background:#fffdf4d9;border-radius:30px;box-shadow:0 18px 50px #87876617;overflow:hidden}.head{padding:28px 20px 0}.eyebrow{font-size:11px;letter-spacing:4px;color:#a3a084;margin:0 0 14px}h1{font:500 29px/1.6 Georgia,"Songti SC",serif;margin:0 0 12px}.intro{font-size:14px;line-height:1.9;color:#96977f;margin:0}.stage{height:240px;display:grid;place-items:center;position:relative}.halo{position:absolute;width:180px;height:180px;border-radius:50%;background:#e8dbad3d}.glass{width:146px;height:195px;position:relative}.glass svg{display:block;width:100%;height:100%;position:relative}.sand-top{transform-origin:73px 94px}.sand-bottom{transform:scaleY(.1);transform-origin:73px 173px}.stream{opacity:0}.running .sand-top{animation:empty 3s linear forwards}.running .sand-bottom{animation:fill 3s linear forwards}.running .stream{opacity:1}.done .sand-top{transform:scaleY(0)}.done .sand-bottom{transform:scaleY(1)}.tick{position:absolute;right:33px;bottom:21px;font-size:11px;color:#a5a18a;letter-spacing:2px}.body{padding:0 22px 26px}.letter{min-height:128px;border:1px solid #e7dfc5;background:#fffdf6;border-radius:22px;display:grid;place-items:center;padding:20px 12px}.letter p{font:18px/1.95 Georgia,"Songti SC",serif;white-space:pre-line;margin:0}.step{font-size:11px;letter-spacing:2px;color:#a8a087;min-height:20px;margin:15px 0}.go{width:100%;min-height:49px;border:0;border-radius:24px;background:#899e90;color:#fffdf5;padding:13px;font:500 15px/1.5 -apple-system,"PingFang SC",sans-serif;cursor:pointer}.go:disabled{background:#b0bdae;cursor:default}.skip{background:none;color:#9b9275;border:0;border-bottom:1px solid #d2c8a9;border-radius:0;min-height:42px;padding:8px 3px;font-size:12px;margin:8px 0 0;cursor:pointer}.music{background:#f0f4eb;border:1px solid #dce5d7;border-radius:20px;padding:15px 12px;margin-top:22px}.music h2{font-size:12px;font-weight:500;color:#919a83;margin:0 0 11px}audio{display:block;width:100%;height:42px}.music p{font-size:11px;color:#9aa18a;line-height:1.8;margin:10px 0 0}.foot{font-size:11px;color:#a6a28a;text-align:center;line-height:1.9;margin-top:20px}button:focus-visible,a:focus-visible{outline:3px solid #89947a;outline-offset:4px}@keyframes empty{to{transform:scaleY(0)}}@keyframes fill{from{transform:scaleY(.1)}to{transform:scaleY(1)}}@media(max-width:350px){h1{font-size:25px}.body{padding:0 15px 24px}.letter p{font-size:17px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main><a class="back" href="../../../">← 返回心意合集</a><section class="card"><header class="head"><p class="eyebrow">给 忙 碌 的 日 子 · 留 一 点 柔 软</p><h1>晓晓，借三秒想你一下</h1><p class="intro">让小沙漏慢慢走一会儿，<br>打开一句今天想说给你的话。</p></header><div class="stage" id="stage" aria-hidden="true"><div class="halo"></div><div class="glass"><svg viewBox="0 0 146 195"><path d="M32 23H114V43C114 68 81 82 78 98C81 113 114 126 114 152V174H32V152C32 126 65 113 68 98C65 82 32 68 32 43Z" fill="#e4f0ec99" stroke="#a7bcb0" stroke-width="2"/><path class="sand-top" d="M40 47H106C103 66 79 81 73 94C67 81 43 66 40 47Z" fill="#dfb563"/><path class="sand-bottom" d="M39 173H107L73 133Z" fill="#dfb563"/><path class="stream" d="M73 98V163" stroke="#dfb563" stroke-width="2" stroke-dasharray="3 3"/><path d="M27 20H119M27 177H119" stroke="#a69a77" stroke-width="9" stroke-linecap="round"/><path d="M23 25V171M123 25V171" stroke="#b6ac8a" stroke-width="5" stroke-linecap="round"/><path d="M42 31V43" stroke="white" stroke-width="3" stroke-linecap="round"/></svg></div><span class="tick" id="tick">三秒小沙漏</span></div><div class="body"><div class="letter" role="status" aria-live="polite"><p id="words">生活总有好多事情要忙，<br>但想起你，不需要特意腾出时间。</p></div><p class="step" id="step">三句小心里话 · 等你打开</p><button class="go" id="go" type="button">翻动沙漏，借三秒想你 ♡</button><button class="skip" id="skip" type="button">不用等，直接打开一句</button><section class="music" aria-label="背景音乐"><h2>♫ 轻柔配乐 · 随时播放</h2><audio id="music" controls loop playsinline preload="metadata"><source src="../../../assets/soft-evening.mp3" type="audio/mpeg">此浏览器不支持音频播放。</audio><p id="music-status" role="status">点播放器里的 ▶，听一段轻柔的音乐。</p></section></div></section><p class="foot">2026 · 11 · 25<br>几秒钟很短，想和你慢慢过的日子很长。</p></main><script>
(function(){'use strict';var notes=['手边的事情告一段落，\n就想和你说说今天过得怎么样。\n这些小分享，我还是最想留给你。','想你有时候很简单，\n只是忽然想起两个人坐在一起，\n各忙各的，也觉得很踏实。','等下次见面，\n想陪你把一顿饭慢慢吃完，\n不赶着收拾，也不赶着说再见。'];var index=0,busy=false,timer=null,remaining=3,stage=document.getElementById('stage'),tick=document.getElementById('tick'),words=document.getElementById('words'),step=document.getElementById('step'),go=document.getElementById('go'),skip=document.getElementById('skip');function finish(){if(timer!==null)clearTimeout(timer);timer=null;busy=false;stage.classList.remove('running');stage.classList.add('done');words.textContent=notes[index];step.textContent='第 '+(index+1)+' / 3 句 · 今天也惦记你';index=(index+1)%notes.length;go.disabled=false;go.textContent=index===0?'再翻一次，重读这些小心意 ↻':'再借三秒，打开下一句 ♡';tick.textContent='这句心意，给你';skip.textContent='直接看下一句'}function countdown(){remaining--;tick.textContent='还有 '+remaining+' 秒';if(remaining===0)finish();else timer=setTimeout(countdown,1000)}go.addEventListener('click',function(){if(busy)return;busy=true;go.disabled=true;go.textContent='沙漏正慢慢走…';remaining=3;stage.classList.remove('done');stage.classList.remove('running');void stage.offsetWidth;stage.classList.add('running');tick.textContent='还有 3 秒';timer=setTimeout(countdown,1000)});skip.addEventListener('click',finish);document.addEventListener('visibilitychange',function(){if(document.hidden&&busy)finish()});window.addEventListener('pagehide',function(){if(busy)finish()});var music=document.getElementById('music'),status=document.getElementById('music-status');music.addEventListener('playing',function(){status.textContent='正在播放 · 陪你慢慢读'});music.addEventListener('pause',function(){status.textContent='音乐已暂停 · 点 ▶ 继续听'});music.addEventListener('error',function(){status.textContent='音乐暂未加载成功，请点播放器重试。'});document.addEventListener('visibilitychange',function(){if(document.hidden)music.pause()});window.addEventListener('pagehide',function(){music.pause()})})();
</script></body></html>
