<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#182e45"><title>晓晓，把想念连成星光</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:radial-gradient(ellipse at top,#335168,#152a40 65%);color:#f8efdc;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding:calc(18px + env(safe-area-inset-top)) 18px calc(28px + env(safe-area-inset-bottom))}main{max-width:460px;margin:auto}.back{display:inline-block;color:#b6c7ce;font-size:14px;text-decoration:none;padding:12px 0 18px}.card{background:#ffffff07;border:1px solid #e4efee26;border-radius:30px;overflow:hidden;text-align:center;box-shadow:0 20px 45px #071c2d35}.head{padding:28px 20px 0}.eyebrow{font-size:11px;letter-spacing:4px;color:#abc1c6;margin:0 0 13px}h1{font:500 29px/1.6 Georgia,"Songti SC",serif;margin:0 0 12px}.intro{font-size:14px;line-height:1.9;color:#b5c9cd;margin:0}.sky{position:relative;width:min(100%,340px);height:260px;margin:15px auto 10px;background-image:radial-gradient(#bed6df80 1px,transparent 1px);background-size:43px 51px}.sky svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.link{stroke:#e6c37c;stroke-width:1.5;fill:none;opacity:0;transition:opacity .7s}.link.on{opacity:.8}.heart{stroke:#f1d29b;stroke-width:2;fill:#f5c98f10;stroke-dasharray:600;stroke-dashoffset:600;opacity:0;transition:stroke-dashoffset 2s,opacity .5s}.complete .heart{stroke-dashoffset:0;opacity:1}.star{position:absolute;width:59px;height:59px;background:#f4dda811;border:1px solid #f0d9a135;border-radius:50%;color:#a5bcc4;font-size:30px;cursor:pointer;touch-action:manipulation;transition:background .5s,box-shadow .5s,color .5s;transform:translate(-50%,-50%)}.star[aria-pressed="true"]{color:#ffe0a2;background:#eac88e20;border-color:#e9ca8d;box-shadow:0 0 27px #ffdc9d30}.s1{left:25%;top:33%}.s2{left:75%;top:33%}.s3{left:70%;top:67%}.s4{left:30%;top:67%}.body{padding:0 22px 26px}.count{font-size:11px;letter-spacing:2px;color:#aec2c5;margin:0 0 18px}.letter{min-height:127px;display:grid;place-items:center;padding:19px 12px;background:#0b223b4d;border:1px solid #bcd6d326;border-radius:22px}.letter p{font:18px/1.95 Georgia,"Songti SC",serif;white-space:pre-line;margin:0}.reset{border:1px solid #adc5c455;background:#ffffff08;color:#d1dfdc;min-height:45px;border-radius:23px;padding:11px 18px;font:14px/1.5 -apple-system,"PingFang SC",sans-serif;margin-top:18px;cursor:pointer}.music{background:#e5edf012;border:1px solid #bfd2d02e;padding:15px 12px;border-radius:19px;margin-top:22px}.music h2{font-size:12px;font-weight:500;color:#c1d0d1;margin:0 0 11px}audio{display:block;width:100%;height:42px}.music p{font-size:11px;color:#a9c0c5;line-height:1.8;margin:10px 0 0}.foot{font-size:11px;color:#91acb7;text-align:center;line-height:1.9;margin-top:21px}button:focus-visible,a:focus-visible{outline:3px solid #ffe1a6;outline-offset:4px}@media(max-width:350px){h1{font-size:25px}.body{padding-left:15px;padding-right:15px}.letter p{font-size:17px}.sky{height:240px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main><a class="back" href="../../../">← 返回心意合集</a><section class="card"><header class="head"><p class="eyebrow">隔 着 距 离 · 也 有 星 光</p><h1>晓晓，把想念连成星光</h1><p class="intro">这里有四颗小星星。<br>随手点亮它们，看看想念会连成什么。</p></header><div class="sky" id="sky" role="group" aria-label="点亮四颗星星"><svg viewBox="0 0 340 260" preserveAspectRatio="none" aria-hidden="true"><path class="link" id="line0" d="M85 86 255 86"/><path class="link" id="line1" d="M255 86 238 174"/><path class="link" id="line2" d="M238 174 102 174"/><path class="link" id="line3" d="M102 174 85 86"/><path class="heart" d="M170 181C146 161 115 139 115 118C115 91 150 86 170 109C190 86 225 91 225 118C225 139 194 161 170 181Z"/></svg><button class="star s1" type="button" aria-label="点亮第一颗星星" aria-pressed="false">✧</button><button class="star s2" type="button" aria-label="点亮第二颗星星" aria-pressed="false">✧</button><button class="star s3" type="button" aria-label="点亮第三颗星星" aria-pressed="false">✧</button><button class="star s4" type="button" aria-label="点亮第四颗星星" aria-pressed="false">✧</button></div><div class="body"><p class="count" id="count">还没点亮 · 0 / 4</p><div class="letter" role="status" aria-live="polite"><p id="words">不用找最亮的那一颗，<br>你点到的这一颗，就有我的心里话。</p></div><button class="reset" id="reset" type="button" hidden>再点亮一次这片小星空 ↻</button><section class="music" aria-label="背景音乐"><h2>♫ 配一段轻柔的音乐</h2><audio id="music" controls loop playsinline preload="metadata"><source src="../../../assets/soft-evening.mp3" type="audio/mpeg">此浏览器不支持音频播放。</audio><p id="music-status" role="status">想听音乐时，点播放器里的 ▶。</p></section></div></section><p class="foot">2026 · 11 · 23<br>把平常日子里的喜欢，一点一点留给你。</p></main><script>
(function(){'use strict';var notes=['不在你身边的时候，\n也想知道你最近喜欢什么，\n好让下次见面多一点小惊喜。','喜欢听你讲那些没什么大不了的小事，\n因为是你说的，\n我就觉得有意思。','有些话不用等到特别的日子，\n比如今天，\n我也很想和你待在一起。','下次一起散步，\n我们不赶着去哪儿，\n就随便走走，聊聊。'];var stars=Array.prototype.slice.call(document.querySelectorAll('.star')),seen=[false,false,false,false],n=0,sky=document.getElementById('sky'),words=document.getElementById('words'),count=document.getElementById('count'),reset=document.getElementById('reset');function links(){for(var j=0;j<4;j++)document.getElementById('line'+j).classList.toggle('on',seen[j]&&seen[(j+1)%4])}stars.forEach(function(star,i){star.addEventListener('click',function(){if(!seen[i]){seen[i]=true;n++;star.setAttribute('aria-pressed','true');star.textContent='✦'}words.textContent=notes[i];count.textContent='已点亮 '+n+' / 4 颗星星';links();reset.hidden=false;if(n===4){sky.classList.add('complete');count.textContent='四颗星星 · 连成一份喜欢';if(!star.dataset.read){words.textContent='晓晓，距离让我们分开看风景，\n却没耽误我，\n把好多小事都想说给你听。'}}star.dataset.read='yes'})});reset.addEventListener('click',function(){seen=[false,false,false,false];n=0;stars.forEach(function(s){s.setAttribute('aria-pressed','false');s.textContent='✧';delete s.dataset.read});links();sky.classList.remove('complete');count.textContent='还没点亮 · 0 / 4';words.textContent='不用找最亮的那一颗，\n你点到的这一颗，就有我的心里话。';reset.hidden=true;stars[0].focus()});var music=document.getElementById('music'),status=document.getElementById('music-status');music.addEventListener('playing',function(){status.textContent='正在播放 · 陪你慢慢看星星'});music.addEventListener('pause',function(){status.textContent='音乐已暂停 · 点 ▶ 继续听'});music.addEventListener('error',function(){status.textContent='音乐暂未加载成功，请点播放器重试。'});document.addEventListener('visibilitychange',function(){if(document.hidden)music.pause()});window.addEventListener('pagehide',function(){music.pause()})})();
</script></body></html>
