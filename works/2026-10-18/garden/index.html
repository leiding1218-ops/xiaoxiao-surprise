<!doctype html><html lang="zh-CN"><head><meta name="robots" content="noindex,nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6eee8"><meta name="description" content="晓晓，轻轻点一下，把今天的想念种成花。"><title>晓晓，把想念种成花 🌷</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6eee8;color:#56483e;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:28px 20px;overflow-x:hidden}.card{width:100%;max-width:420px;text-align:center;padding:32px 22px 25px;border:1px solid #fff9;background:#fffaf3;border-radius:180px 180px 28px 28px;box-shadow:0 18px 60px #a57d5c14}.tag{font-size:11px;letter-spacing:4px;color:#9f8975;margin:12px 0 22px}h1{font-family:Georgia,"Songti SC",serif;font-weight:500;font-size:29px;line-height:1.6;margin:0}h1 span{display:block;color:#8a9d79;font-size:23px}.garden{height:240px;position:relative;margin:12px auto;width:240px}.soil{position:absolute;bottom:26px;width:140px;height:20px;border-radius:50%;background:#e4d4bd;left:50px}.stem{position:absolute;bottom:37px;width:5px;height:0;background:#88a174;left:118px;border-radius:5px;transition:height .7s}.leaf{position:absolute;width:45px;height:22px;background:#9eb58b;bottom:87px;left:77px;border-radius:3px 30px 3px 30px;opacity:0;transform:rotate(20deg);transition:opacity .7s}.leaf.right{left:120px;bottom:110px;transform:scaleX(-1) rotate(15deg)}.bloom{position:absolute;top:29px;left:63px;width:115px;height:115px;transform:scale(0);transition:transform .8s cubic-bezier(.2,.8,.2,1.2)}.petal{position:absolute;background:#e9a898;width:58px;height:72px;left:28px;top:0;transform-origin:50% 80%;border-radius:65% 65% 45% 45%;box-shadow:inset 0 0 15px #fff3}.petal:nth-child(2){transform:rotate(72deg);background:#edb7a5}.petal:nth-child(3){transform:rotate(144deg)}.petal:nth-child(4){transform:rotate(216deg);background:#edb7a5}.petal:nth-child(5){transform:rotate(288deg)}.center{position:absolute;left:40px;top:42px;background:#f5ddb1;border-radius:50%;width:34px;height:34px;box-shadow:0 3px 8px #ad775933}.seed{position:absolute;font-size:35px;left:99px;bottom:29px;transition:opacity .4s}.sun{position:absolute;right:6px;top:15px;color:#d4ab68;font-size:31px;opacity:0;transition:opacity .6s}#copy{font-size:16px;line-height:1.9;min-height:91px;margin:0 0 19px;white-space:pre-line}button{font:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;border:0}#action{border-radius:30px;background:#849b74;color:white;min-height:54px;width:100%;padding:14px 18px;font-size:17px;box-shadow:0 5px 0 #6b825c}#action:active{transform:translateY(3px);box-shadow:0 2px 0 #6b825c}#reset{background:none;color:#9b8978;margin-top:22px;font-size:13px;padding:8px}button:focus-visible{outline:3px solid #bc806b;outline-offset:4px}.note{font-size:11px;color:#b19d89;letter-spacing:2px;margin-top:12px}.float{position:fixed;pointer-events:none;z-index:2;animation:rise 3s ease-out forwards;font-size:24px}@keyframes rise{to{transform:translate(var(--x),-55vh) rotate(30deg);opacity:0}}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.float{display:none}}@media(max-height:700px){.card{padding-top:20px}.garden{height:210px}.tag{margin:6px 0 14px}}
</style></head><body><main class="card"><p class="tag">给 晓 晓 的 小 花 园</p><h1>把想念种成花<span>让它替我陪着你</span></h1><div class="garden" role="img" aria-label="随着点击，从种子长成一朵花"><div class="sun">☀</div><div class="soil"></div><div class="stem"></div><div class="leaf"></div><div class="leaf right"></div><div class="bloom"><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="center"></i></div><div class="seed">🌱</div></div><p id="copy" role="status" aria-live="polite">晓晓，早安呀<br>我把今天的第一份想念<br>悄悄种在这里了</p><button id="action" type="button">给想念浇点水 💧</button><br><button id="reset" type="button" hidden>再种一朵 ↻</button><p class="note">2026.10.18 · 一点想念，慢慢开花</p></main><script>
// 修改名字和情话即可个性化；全部素材由 CSS 绘制，无外部依赖。
var name='晓晓',step=0;var action=document.getElementById('action'),copy=document.getElementById('copy'),reset=document.getElementById('reset'),stem=document.querySelector('.stem'),bloom=document.querySelector('.bloom'),seed=document.querySelector('.seed'),sun=document.querySelector('.sun'),leaves=document.querySelectorAll('.leaf');
function floating(){if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;for(var i=0;i<14;i++){var e=document.createElement('span');e.className='float';e.textContent=i%2?'♡':'✿';e.style.color=i%2?'#cc8f84':'#9bac87';e.style.left=(10+Math.random()*80)+'vw';e.style.top=(60+Math.random()*25)+'vh';e.style.setProperty('--x',(Math.random()*120-60)+'px');document.body.appendChild(e);(function(node){setTimeout(function(){if(node.parentNode)node.parentNode.removeChild(node)},3100)})(e)}}
action.onclick=function(){step++;if(step===1){seed.style.opacity='0';stem.style.height='85px';leaves[0].style.opacity='1';copy.textContent='有你的日子\n连平平常常的早晨\n都多了一点甜';action.textContent='再给它一点阳光 ☀️'}else if(step===2){stem.style.height='145px';leaves[1].style.opacity='1';sun.style.opacity='1';copy.textContent='隔着距离，也想提醒你\n好好吃饭，别太累\n你一直被我惦记着';action.textContent='轻轻点一下，让它开花 🌷'}else{bloom.style.transform='scale(1)';copy.textContent=name+'，这朵小花送给你\n等见到你的时候\n再把欠你的拥抱补上';action.textContent='收下这份想念 💗';reset.hidden=false;floating()}};
reset.onclick=function(){step=0;seed.style.opacity='1';stem.style.height='0';for(var i=0;i<leaves.length;i++)leaves[i].style.opacity='0';sun.style.opacity='0';bloom.style.transform='scale(0)';copy.textContent=name+'，早安呀\n我把今天的第一份想念\n悄悄种在这里了';action.textContent='给想念浇点水 💧';reset.hidden=true;action.focus()};
</script><a href="../../../" aria-label="返回心意合集" style="position:fixed;top:12px;left:12px;z-index:10;background:#fffaf3ef;border:1px solid #ddc8b8;border-radius:24px;padding:10px 14px;color:#725749;font:14px -apple-system,sans-serif;text-decoration:none">← 心意合集</a></body></html>
