<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#edf5ef"><title>晓晓，拼一颗心给你</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:radial-gradient(ellipse at top,#fff9ed,#edf5ef 60%);color:#43594f;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding:calc(20px + env(safe-area-inset-top)) 20px calc(30px + env(safe-area-inset-bottom))}main{max-width:460px;margin:auto}.back{display:inline-block;color:#607569;text-decoration:none;padding:12px 0;font-size:14px}.card{background:#ffffffbc;border:1px solid #d7e4d9;border-radius:30px;padding:28px 22px;box-shadow:0 18px 55px #62846d15;text-align:center}.eyebrow{font-size:11px;letter-spacing:4px;color:#80937e;margin:0 0 14px}h1{font:500 30px/1.5 Georgia,"Songti SC",serif;margin:0 0 12px}.intro{font-size:15px;line-height:1.9;color:#738176;margin:0}.puzzle{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:min(100%,280px);margin:28px auto 22px}.tile{position:relative;aspect-ratio:1;border:1px solid #d4e2d7;background:#e7f0e7;border-radius:18px;font:500 16px/1.5 inherit;color:#536f5b;cursor:pointer;overflow:hidden;touch-action:manipulation;transition:background .4s,transform .3s;min-height:110px}.tile:active{transform:scale(.97)}.tile:focus-visible,.reset:focus-visible{outline:3px solid #8e645f;outline-offset:4px}.tile span{position:relative;z-index:1}.tile.on{background:#f5d7c9;border-color:#eabfad}.tile.on span{color:transparent}.tile:after{position:absolute;content:"";width:90px;height:90px;background:#d58f83;opacity:0;transition:opacity .5s;pointer-events:none}.tile.on:after{opacity:1}.tile:nth-child(1):after{border-radius:50% 50% 0 50%;right:0;bottom:0;transform:rotate(0deg)}.tile:nth-child(2):after{border-radius:50% 50% 50% 0;left:0;bottom:0}.tile:nth-child(3):after{right:0;top:0;clip-path:polygon(0 0,100% 0,100% 100%)}.tile:nth-child(4):after{left:0;top:0;clip-path:polygon(0 0,100% 0,0 100%)}.puzzle.complete{animation:beat 1s ease}.message{border-radius:20px;background:#fff9f2;padding:18px 14px;min-height:112px;display:grid;place-items:center;border:1px solid #ede1d3}.message p{margin:0;font:18px/1.9 Georgia,"Songti SC",serif;white-space:pre-line}.count{font-size:12px;letter-spacing:2px;color:#829281;margin:17px 0}.reset{border:1px solid #c9d8ca;border-radius:25px;padding:12px 22px;background:#f8fbf6;color:#56725d;font-size:14px;cursor:pointer}.foot{font-size:12px;line-height:1.9;color:#879486;margin:20px 0 0}.petal{position:fixed;top:-25px;pointer-events:none;z-index:20;color:#d58f83;animation:fall 3s ease-in forwards}@keyframes beat{30%{transform:scale(1.035)}60%{transform:scale(.985)}100%{transform:none}}@keyframes fall{to{transform:translate(25px,100vh) rotate(170deg);opacity:0}}@media(max-width:350px){.card{padding:24px 15px}h1{font-size:26px}.tile:after{width:75px;height:75px}}@media(prefers-reduced-motion:reduce){*,*:after{animation:none!important;transition:none!important}}
</style></head><body><main><a class="back" href="../../../">← 返回心意合集</a><section class="card"><p class="eyebrow">四 片 日 常 · 一 颗 真 心</p><h1>晓晓，拼一颗心给你</h1><p class="intro">把零零碎碎的喜欢，<br>拼成今天想送给你的心意。</p><div class="puzzle" id="puzzle" aria-label="点亮四块心意拼图"><button class="tile" type="button" aria-pressed="false" data-piece="0"><span>早安</span></button><button class="tile" type="button" aria-pressed="false" data-piece="1"><span>惦记</span></button><button class="tile" type="button" aria-pressed="false" data-piece="2"><span>分享</span></button><button class="tile" type="button" aria-pressed="false" data-piece="3"><span>陪伴</span></button></div><div class="message" role="status" aria-live="polite"><p id="words">随手点一块，\n拆开一点藏在日常里的喜欢。</p></div><p class="count" id="count">已点亮 0 / 4 片心意</p><button class="reset" id="reset" type="button" hidden>再拼一次今天的喜欢 ↻</button><p class="foot">2026 · 10 · 24<br>每一片小日常，都有你的位置。</p></section></main><script>
(function(){'use strict';var notes=['醒来想起你的时候，\n平常的一天也有了期待。','看到好天气，会想告诉你；\n遇到小事情，也想听听你的声音。','想把路上的小趣事留给你，\n让我们的聊天多一点笑声。','不急着把日子过得多精彩，\n能和你慢慢过，就很喜欢。'];var tiles=Array.prototype.slice.call(document.querySelectorAll('.tile')),seen=[false,false,false,false],n=0,words=document.getElementById('words'),count=document.getElementById('count'),puzzle=document.getElementById('puzzle'),reset=document.getElementById('reset');tiles.forEach(function(tile,i){tile.addEventListener('click',function(){if(seen[i]){if(n<4)words.textContent=notes[i];return}seen[i]=true;n++;tile.classList.add('on');tile.setAttribute('aria-pressed','true');count.textContent='已点亮 '+n+' / 4 片心意';words.textContent=notes[i];if(n===4){words.textContent='我的喜欢没有惊天动地，\n只是每一片日常，都想有你。';puzzle.classList.add('complete');reset.hidden=false;if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches){for(var j=0;j<12;j++){var p=document.createElement('span');p.className='petal';p.textContent='♡';p.setAttribute('aria-hidden','true');p.style.left=(5+Math.random()*90)+'vw';p.style.animationDelay=(Math.random()*.6)+'s';document.body.appendChild(p);setTimeout(function(el){return function(){el.remove()} }(p),4200)}}}})});reset.addEventListener('click',function(){seen=[false,false,false,false];n=0;tiles.forEach(function(t){t.classList.remove('on');t.setAttribute('aria-pressed','false')});puzzle.classList.remove('complete');words.textContent='随手点一块，\n拆开一点藏在日常里的喜欢。';count.textContent='已点亮 0 / 4 片心意';reset.hidden=true;tiles[0].focus()})})();
</script><script src="../../../music.js?v=20261023-1"></script></body></html>
