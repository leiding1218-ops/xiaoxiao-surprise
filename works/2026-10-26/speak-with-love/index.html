(function(){'use strict';var lines=["晓晓，今天听你说起那晚的事","我才听见，那些话有多伤人","明明盼着见你","嘴上却说以后再也不视频了","明明很珍惜和你相处的时间","却说得像你是我的负担","对不起，老婆","想念你，不是我伤害你的理由","以后失落了，我会好好告诉你","想你了，就直接说想你","我想让你从我的话里","听见爱，也感到安心"],frames=[];for(var j=0;j<lines.length;j+=2)frames.push(lines[j]+'\n'+lines[j+1]);var index=0,playing=false,ended=false,timer=null,subtitle=document.getElementById('subtitle'),status=document.getElementById('status'),fill=document.getElementById('fill'),progress=document.getElementById('progress'),play=document.getElementById('play'),prev=document.getElementById('prev'),next=document.getElementById('next');function clear(){if(timer!==null){clearTimeout(timer);timer=null}}function music(start){if(window.XiaoxiaoMusic){if(start)window.XiaoxiaoMusic.play();else window.XiaoxiaoMusic.pause()}}function render(){subtitle.textContent=frames[index];subtitle.classList.remove('enter');void subtitle.offsetWidth;subtitle.classList.add('enter');fill.style.width=((index+1)/frames.length*100)+'%';progress.setAttribute('aria-valuenow',String(index+1));prev.disabled=index===0;next.disabled=index===frames.length-1;status.textContent=ended?'这段话说完了，你可以慢慢读':'第 '+(index+1)+' / '+frames.length+' 段';play.textContent=playing?'Ⅱ 暂停，慢慢看':ended?'再听我说一遍 ↻':'继续播放 ♡'}function schedule(){clear();timer=setTimeout(function(){if(!playing)return;if(index<frames.length-1){index++;render();schedule()}else{playing=false;ended=true;render();music(false)}},7000)}play.addEventListener('click',function(){if(playing){playing=false;clear();render();music(false);return}if(ended){index=0;ended=false}playing=true;render();music(true);schedule()});function step(delta){clear();index=Math.max(0,Math.min(frames.length-1,index+delta));ended=false;render();if(playing)schedule()}prev.addEventListener('click',function(){step(-1)});next.addEventListener('click',function(){step(1)});document.addEventListener('visibilitychange',function(){if(document.hidden&&playing){playing=false;clear();render();music(false)}});window.addEventListener('pagehide',function(){playing=false;clear();music(false)});fill.style.width=(100/frames.length)+'%'})();
